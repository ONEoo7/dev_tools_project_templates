# Builds the native installers with installers/build.py: an NSIS setup.exe on
# Windows, .deb and .rpm packages on Linux, and a .dmg on macOS, plus a portable
# .zip/.tar.gz for each. Runs for version tags (v*), attaching everything to a
# draft release, and on demand.
# On GitLab, delete this directory and keep .gitlab-ci.yml instead.
name: Installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install NSIS
        if: runner.os == 'Windows'
        run: choco install nsis --version=3.12.0 --no-progress --yes
      - name: Install nFPM
        if: runner.os == 'Linux'
        env:
          NFPM_VERSION: "2.47.0" # update NFPM_SHA256 together with it
          NFPM_SHA256: 0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783
        run: |
          curl -fsSLo /tmp/nfpm.tar.gz "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          echo "${NFPM_SHA256}  /tmp/nfpm.tar.gz" | sha256sum --check
          sudo tar -xzf /tmp/nfpm.tar.gz -C /usr/local/bin nfpm
      - name: Build installers
        run: uv run --locked installers/build.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installers-${{ runner.os }}
          path: dist/
          if-no-files-found: error

  release:
    name: Attach to a draft release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: installers-*
          path: dist
          merge-multiple: true
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --draft --generate-notes --title "$TAG"
          gh release upload "$TAG" dist/* --clobber
